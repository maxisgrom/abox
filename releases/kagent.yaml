apiVersion: v1
kind: Namespace
metadata:
  name: kagent
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
  ref:
    tag: "0.10.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 1h
  releaseName: kagent
  # Flux appends the OCIRepository artifact digest to the chart version as
  # semver build metadata, so Helm sees 0.10.1+dc7fc6109072. kagent's Chart.yaml
  # has no appVersion, so app.kubernetes.io/version falls back to .Chart.Version
  # and inherits the '+', which Kubernetes rejects as a label value:
  #
  #   ServiceAccount "kagent-controller" is invalid: metadata.labels:
  #   Invalid value: "0.10.1+dc7fc6109072"
  #
  # Subcharts are unaffected -- they carry their own Chart.Version -- which is
  # why tools, kmcp and grafana-mcp installed while the controller, UI,
  # postgresql, ModelConfig and RemoteMCPServer did not. All 21 broken objects
  # carry app.kubernetes.io/name=kagent, so rewrite the label on those.
  #
  # This is not visible in a local `helm template`: the build metadata is added
  # by Flux, not by the chart.
  postRenderers:
  - kustomize:
      patches:
      - patch: |
          - op: add
            path: /metadata/labels/app.kubernetes.io~1version
            value: "0.10.1"
        target:
          labelSelector: app.kubernetes.io/name=kagent
  dependsOn:
    - name: kagent-crds
      namespace: kagent
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # Image tags must be set explicitly. Left unset, the chart falls back to
    # .Chart.Version for the image reference, which Flux has made
    # 0.10.1+dc7fc6109072 -- and '+' is not legal in a tag:
    #
    #   Failed to apply default image tag
    #   "ghcr.io/kagent-dev/kagent/controller:0.10.1+dc7fc6109072":
    #   invalid reference format ... InvalidImageName
    #
    # The chart sanitises the '+' for helm.sh/chart but not for the image tags
    # or app.kubernetes.io/version, which the postRenderer above handles.
    # Postgres and the subcharts pin their own images and are unaffected.
    tag: "0.10.1"
    controller:
      image:
        tag: "0.10.1"
    ui:
      image:
        tag: "0.10.1"
    # 0.10.x drops the per-tool toggles that used to disable querydoc, so the
    # kagent-tools subchart is left at its default.
    istio-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    # providers.openAI.apiKey is deliberately UNSET (not empty-string, not
    # present at all). The chart's modelconfig-secret.yaml template only
    # creates/owns the kagent-openai Secret when apiKeySecretRef AND apiKey
    # are both truthy -- this fork had apiKey set to the literal string
    # "OPENAI_API_KEY" (indistinguishable from the chart's own shipped
    # placeholder at a glance), so the chart recreated that Secret from the
    # placeholder on EVERY Helm upgrade, silently undoing
    # scripts/lab-bootstrap.sh's out-of-band patch each time. Confirmed
    # live 2026-10-02: every kagent.yaml edit this Task 7 session (otel
    # wiring, then the otel fix) re-broke OpenRouter auth for every agent on
    # default-model-config, not just once. Leaving apiKey unset makes the
    # chart treat kagent-openai as purely externally managed -- it still
    # references the Secret via apiKeySecretRef for the ModelConfig, it just
    # never creates or touches it. lab-bootstrap.sh now creates/updates it
    # directly (kubectl apply, not patch) instead of relying on the chart
    # to have made it first.
    providers:
      default: openAI
      # model/baseUrl are non-sensitive config, declared here instead of as
      # an out-of-band `kubectl patch modelconfig default-model-config` --
      # confirmed live that every one of this session's kagent.yaml edits
      # re-rendered default-model-config from the chart's own
      # providers.openAI.model (gpt-4.1-mini, no baseUrl) and reverted the
      # patch, exactly the same disease as the apiKey Secret above. Only the
      # actual credential (apiKeySecretRef's Secret) stays out-of-band --
      # apiKey itself is deliberately absent (see above).
      openAI:
        model: "google/gemini-2.5-flash"
        config:
          baseUrl: "https://openrouter.ai/api/v1"
          temperature: "0"
    # Task 6 optional: kagent ships this block disabled with an empty endpoint
    # by default -- Phoenix has been deployed since Task 3 as "traces & evals"
    # but nothing was ever pointed at it, so it sat empty.
    #
    # Task 7: repointed from Phoenix directly to
    # fwdays-agent-otel-collector.yaml's bridge collector instead. kagent's
    # otel.tracing schema has no headers field (confirmed: endpoint/
    # protocol/insecure/timeout, nothing else), so it can't carry Phoenix's
    # x-project-name or MLflow's x-mlflow-experiment-id itself -- the bridge
    # collector does that fan-out instead, landing the same traces in
    # Phoenix's "fwdays-agents" project, MLflow's "fwdays-agents"
    # experiment, AND the otel-demo chart's own Jaeger, all at once.
    otel:
      tracing:
        enabled: true
        exporter:
          otlp:
            endpoint: "fwdays-agent-otel-collector.kagent.svc.cluster.local:4317"
            protocol: "grpc"
            insecure: true
      # kagent-controller's own spans (the "received this A2A request" hop,
      # distinct from each Agent pod's own spans) never exported at all --
      # confirmed live via `kubectl logs`: "traces export: ... invalid
      # target address "": missing address". The chart's configmap
      # template only emits a unified OTEL_EXPORTER_OTLP_ENDPOINT when
      # tracing and logging endpoints are both set AND equal; leaving
      # logging.exporter.otlp.endpoint empty forced the split
      # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT path instead, which the
      # controller's own process apparently never reads (unlike each Agent
      # pod, which does). Setting the same endpoint here -- logging itself
      # stays disabled (enabled defaults to false, not touched) -- flips
      # the template to the unified branch without actually turning on log
      # export. Symptom this caused: router-agent-fwdays's own child span
      # had a parent_span_id pointing at the controller's never-exported
      # span, so Jaeger (and anything downstream of it) showed "parent span
      # ID ... is not in the trace".
      logging:
        exporter:
          otlp:
            endpoint: "fwdays-agent-otel-collector.kagent.svc.cluster.local:4317"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kagent
  namespace: kagent
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: kagent
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: kagent-controller
      namespace: kagent
      port: 8083
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kagent-ui
      namespace: kagent
      port: 8080
