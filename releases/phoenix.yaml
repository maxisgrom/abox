apiVersion: v1
kind: Namespace
metadata:
  name: phoenix
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: phoenix
  namespace: flux-system
spec:
  interval: 1h
  url: oci://registry-1.docker.io/arizephoenix/phoenix-helm
  ref:
    tag: "12.0.10"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phoenix
  namespace: phoenix
spec:
  interval: 1h
  releaseName: phoenix
  chartRef:
    kind: OCIRepository
    name: phoenix
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # The cluster routes through the agentgateway Gateway, not an Ingress.
    ingress:
      enabled: false
    # The chart's startup probe allows 31s (periodSeconds 1 x failureThreshold
    # 30). Phoenix runs Alembic migrations against Postgres on first boot, which
    # takes longer than that on KinD, so the probe kills the container before it
    # ever binds :6006 and it restarts forever:
    #
    #   Startup probe failed: dial tcp 10.244.2.10:6006: connect: connection refused
    #   Container phoenix failed startup probe, will be restarted
    #
    # Widen the budget to 10 minutes. Liveness and readiness are left alone --
    # they only start counting once the startup probe succeeds.
    healthChecks:
      startupProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 120
    # Task 6 optional: the chart defaults auth.enableAuth to true, but this
    # fork's phoenix.yaml never set up a real admin workflow around it --
    # nothing ever rotated the admin password deliberately, someone just hit
    # Phoenix's forced first-login reset once (2026-09-25, confirmed via the
    # users table: admin@localhost's updated_at is two days after
    # created_at, reset_password already false) and the real password now
    # lives only in Postgres, with PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
    # permanently stale. Worse: OTLP trace ingestion needs auth too, and
    # kagent's otel.tracing exporter has no headers field to carry an API
    # key even if we had one (see releases/kagent.yaml). Disabling auth here
    # matches this lab's existing posture elsewhere (kagent's own
    # AUTH_MODE=unsecure default, xray-memory's bare-token-not-RBAC auth)
    # rather than reimplementing Phoenix's password hashing to recover a
    # lost admin account.
    auth:
      enableAuth: false
