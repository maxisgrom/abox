# OpenTelemetry Demo -- https://opentelemetry.io/docs/demo/kubernetes-deployment/
# Architecture: https://opentelemetry.io/docs/demo/architecture/
#
# Task 6: deploy the reference microservices app the OTel project ships to
# exercise traces, metrics and logs end to end, and study it from an o11y
# point of view.
#
# Unlike den-vasyliev/abox's own feat/otel-demo branch, this keeps the
# chart's bundled jaeger/prometheus/grafana/opensearch backends at their
# default `enabled: true` -- that branch disables all four and routes traces
# into a separate mlflow install instead, which this fork doesn't have and
# doesn't need: the whole point here is to see the demo's own reference o11y
# stack from the architecture doc, not to re-point it at ours.
#
# HTTP Helm repo, not OCI -- the chart isn't published to an OCI registry.
#
# Not wired onto agentgateway-external. frontend-proxy (the chart's single
# envoy entrypoint, fronting the web UI, Jaeger UI, Grafana and the flagd UI)
# is built to own the root path -- kagent.yaml already claims "/" on that
# listener for its own UI, and frontend-proxy's Next.js frontend and the
# jaeger/grafana subpaths behind it aren't written to tolerate a further
# prefix. Access is via the chart's own default instead (Service names are
# the bare component name, not release-prefixed):
#
#   kubectl port-forward -n otel-demo svc/frontend-proxy 8080:8080
#
# then http://localhost:8080/ for the web store, /jaeger/ui/, /grafana/,
# /telemetry/ (Jaeger UI on OTel demo < 0.41 served under /jaeger/, this
# chart's NOTES.txt is the source of truth if the path moves), /feature/.
#
# No /loadgen by default: the chart's component.load-generator.env pins
# LOCUST_HEADLESS: "true", unlike docker-compose's LOCUST_HEADLESS=false, so
# upstream's screenshots of a Locust UI are docker-compose-only unless
# overridden. Overridden here via envOverrides (merged onto the chart's env
# by name, not a wholesale replacement -- see the chart's
# otel-demo.envOverriden helper) plus a service.port so the chart renders a
# Service at all (load-generator gets none by default: no .service block, no
# .ports). Locust's own default web port is 8089, unset here same as
# upstream, so the two line up:
#
#   kubectl port-forward -n otel-demo svc/load-generator 8089:8089
apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-demo
  namespace: otel-demo
spec:
  interval: 1h
  releaseName: opentelemetry-demo
  chart:
    spec:
      chart: opentelemetry-demo
      version: "0.41.2"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
  values:
    components:
      load-generator:
        envOverrides:
          - name: LOCUST_HEADLESS
            value: "false"
        service:
          port: 8089
