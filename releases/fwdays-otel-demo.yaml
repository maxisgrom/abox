# OpenTelemetry Demo -- https://opentelemetry.io/docs/demo/kubernetes-deployment/
# Architecture: https://opentelemetry.io/docs/demo/architecture/
#
# Task 6: deploy the reference microservices app the OTel project ships to
# exercise traces, metrics and logs end to end, and study it from an o11y
# point of view.
#
# Unlike den-vasyliev/abox's own feat/otel-demo branch, this keeps the
# chart's bundled jaeger/prometheus/grafana/opensearch backends at their
# default `enabled: true` -- that branch disables all four and routes traces
# into a separate mlflow install instead, which this fork doesn't have and
# doesn't need: the whole point here is to see the demo's own reference o11y
# stack from the architecture doc, not to re-point it at ours.
#
# HTTP Helm repo, not OCI -- the chart isn't published to an OCI registry.
#
# Not wired onto agentgateway-external. frontend-proxy (the chart's single
# envoy entrypoint, fronting the web UI, Jaeger UI, Grafana and the flagd UI)
# is built to own the root path -- kagent.yaml already claims "/" on that
# listener for its own UI, and frontend-proxy's Next.js frontend and the
# jaeger/grafana subpaths behind it aren't written to tolerate a further
# prefix. Access is via the chart's own default instead (Service names are
# the bare component name, not release-prefixed):
#
#   kubectl port-forward -n otel-demo svc/frontend-proxy 8080:8080
#
# then http://localhost:8080/ for the web store, /jaeger/ui/, /grafana/,
# /telemetry/ (Jaeger UI on OTel demo < 0.41 served under /jaeger/, this
# chart's NOTES.txt is the source of truth if the path moves), /feature/.
#
# No load-generator UI by default: the chart renders no Service for it at
# all (no .service block, no .ports). o11y note: 0.41.2's
# component.load-generator.env still ships the full Locust env block
# (LOCUST_HOST/HEADLESS/AUTOSTART/USERS) alongside k6's -- but the image
# actually run is k6 (confirmed live: pod logs show k6 "browser"/"load"
# scenario output, not a Locust process), so overriding LOCUST_HEADLESS here
# does nothing. The Locust vars are vestigial, left over from before this
# component moved to k6. Use k6's own web dashboard instead
# (https://grafana.com/docs/k6/latest/results-output/web-dashboard/),
# default port 5665, enabled via envOverrides (merged onto the chart's env
# by name, not a wholesale replacement -- see the chart's
# otel-demo.envOverriden helper) plus a matching service.port:
#
#   kubectl port-forward -n otel-demo svc/load-generator 5665:5665
apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-demo
  namespace: otel-demo
spec:
  interval: 1h
  releaseName: opentelemetry-demo
  chart:
    spec:
      chart: opentelemetry-demo
      version: "0.41.2"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
  values:
    components:
      load-generator:
        envOverrides:
          - name: K6_WEB_DASHBOARD
            value: "true"
        service:
          port: 5665
      # Task 7: the agent component (Traceloop/OpenLLMetry-instrumented --
      # it's this chart's actual GenAI tracing demo) defaults to USE_VCR=true,
      # replaying a bundled cassette instead of calling a real LLM, so the
      # demo works with no API key out of the box. That replay path is
      # broken on this chart version: a type bug inside the vcr library
      # itself crashes while exporting the agent's own trace (confirmed live
      # via `kubectl logs` -- TypeError inside vcr/stubs/__init__.py, not
      # our code, not the LLM call). Point it at a real model instead of
      # working around the mock. Reuses the OpenRouter key already proven
      # working for kagent's own ModelConfigs (same base URL, same model),
      # copied cross-namespace as `otel-demo-agent-llm` by
      # scripts/lab-bootstrap.sh -- this chart has no secretKeyRef-shaped
      # values field, but otel-demo.pod.env's $allEnvs list is a raw toYaml
      # dump (templates/_pod.tpl), so a plain Kubernetes EnvVar `valueFrom`
      # works here same as any pod spec, unlike kagent's
      # RemoteMCPServer.headersFrom (which only takes literal strings).
      agent:
        envOverrides:
          - name: LLM_BASE_URL
            value: "https://openrouter.ai/api/v1"
          - name: LLM_MODEL
            value: "google/gemini-2.5-flash"
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                name: otel-demo-agent-llm
                key: OPENROUTER_API_KEY
          - name: USE_VCR
            value: "False"
    # Task 7: fan the same traces this chart's own collector already sends
    # to its bundled Jaeger out to Phoenix and MLflow too, so one real
    # interaction (the agent's GenAI workflow above, plus everything else)
    # is comparable side by side across all three o11y solutions instead of
    # three disconnected samples. Chart default exporters list is
    # [otlp_grpc/jaeger, debug, span_metrics] (values.yaml's
    # service.pipelines.traces) -- Helm replaces lists wholesale rather than
    # merging them, so the override below repeats those three verbatim
    # alongside the two new ones; `processors` is a sibling map key and
    # stays at chart default untouched.
    opentelemetry-collector:
      config:
        exporters:
          # MLflow's tracking server only accepts OTLP/HTTP at POST
          # /v1/traces -- gRPC ingestion isn't implemented
          # (mlflow.org/docs/latest/genai/tracing/opentelemetry/ingest/,
          # confirmed 2026-09-21 per den-vasyliev/abox's own otel-demo
          # branch). x-mlflow-experiment-id routes spans into the
          # "otel-demo" experiment (id "1", created once via POST
          # /api/2.0/mlflow/experiments/create -- not deterministic, redo
          # that call and update this if the mlflow-mlflow PVC is ever
          # wiped).
          otlphttp/mlflow:
            endpoint: http://mlflow-mlflow.mlflow.svc.cluster.local:5000
            tls:
              insecure: true
            headers:
              x-mlflow-experiment-id: "1"
          # Same Phoenix OTLP receiver kagent's otel.tracing already targets
          # (releases/kagent.yaml) -- unauthenticated since Task 6
          # (releases/phoenix.yaml, auth.enableAuth: false).
          otlp_grpc/phoenix:
            endpoint: phoenix-svc.phoenix.svc.cluster.local:4317
            tls:
              insecure: true
        service:
          pipelines:
            traces:
              exporters:
                - otlp_grpc/jaeger
                - debug
                - span_metrics
                - otlphttp/mlflow
                - otlp_grpc/phoenix
