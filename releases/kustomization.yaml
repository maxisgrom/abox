apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - agentgateway.yaml
  - agentregistry.yaml
  - agent-retrieval.yaml
  - kagent.yaml
  - llama-cpp-embeddings.yaml
  - llmd.yaml
  - mcp-servers.yaml
  - neo4j.yaml
  - phoenix.yaml
  - qdrant.yaml
  # fwdays overlay — additive only, no upstream file is modified. Keeping the
  # overlay to new files means this list is the sole merge point when the
  # branch is rebased onto another abox feature branch.
  - fwdays-bge-m3-embeddings.yaml
  - fwdays-mcp-servers.yaml
  - fwdays-agent-retrieval.yaml
  - fwdays-xray-memory.yaml
  - fwdays-memory-agent.yaml
  - fwdays-memory-write-agent.yaml
  - fwdays-router-agent.yaml
  - fwdays-news-mcp-server.yaml
