# fwdays overlay -- Task 5 step 4: wire xray-memory into kagent.
#
# xray-memory-fwdays (releases/fwdays-xray-memory.yaml) only exposes an HTTP
# MCP endpoint of its own; nothing in kagent could call it until this file.
# RemoteMCPServer, not MCPServer -- xray-memory is already a long-lived
# Deployment serving /mcp itself, unlike the stdio qdrant-mcp servers kagent's
# kmcp gateway spawns a process for.
#
# A dedicated agent, not a third toolset bolted onto retrieval-agent-fwdays:
# that agent's prompt is built around exactly two stores (a vector collection,
# a Cypher graph) being compared side by side. xray-memory is a structurally
# different thing -- one server holding both a graph AND its own vector index
# together, addressed through its own tool names -- and mixing it into that
# prompt would blur what retrieval-agent-fwdays demonstrates rather than add
# to it.
#
# Tool names come from `strings` on the public binary (ghcr.io/den-vasyliev/
# abox/xray-memory), not documentation -- the chart/README don't enumerate
# them. Full set found: search_graph, search_graph_docs, get_graph_node,
# get_graph_impact, get_graph_risk, get_graph_stats, update_code_graph,
# list_skills, get_skill, recall, remember, forget. Only three are meaningful
# against THIS corpus and bound below:
#   - search_graph, get_graph_node: what the eval in Task 5 step 5 exercises.
#   - get_graph_stats: cheap sanity check ("how big is this map").
# Left out: get_graph_impact/get_graph_risk (blast-radius/risk scoring assumes
# a parsed CODE graph with call sites; our servicemap catalog has none of
# that structure, so these would run but answer nothing meaningful).
# list_skills/get_skill (no skills map shipped in this corpus).
# recall/remember/forget were left out here originally because
# server.writable was false; that changed 2026-09-26 (writable, PVC, seeded --
# see releases/fwdays-xray-memory.yaml). Left out of THIS agent regardless:
# memory-agent-fwdays is what scripts/memory-eval measured for ADR 0004, and
# changing its tool list would invalidate that result. The write-capable
# sibling, memory-write-agent-fwdays, lives in
# releases/fwdays-memory-write-agent.yaml and binds those three tools instead.
#
# 2026-09-26: xray-memory-fwdays now requires bearer auth (chart 0.7.0's
# server.auth, turned on the same day writable did -- see
# fwdays-xray-memory.yaml for why). headersFrom below carries it; the Secret
# holds it pre-formatted as "Bearer <token>" under the `bearer` key, because
# RemoteMCPServer's headersFrom takes a Secret value verbatim -- there is no
# way to template a prefix onto it. `token` (no prefix) is a separate key in
# the same Secret, used by the server itself (server.auth.secretKey).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: xray-memory-fwdays
  namespace: kagent
  labels:
    fwdays.overlay: "true"
spec:
  description: xray-memory serving the fwdays service-graph corpus (Task 5)
  protocol: STREAMABLE_HTTP
  url: http://xray-memory-fwdays.xray-memory:8085/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: xray-memory-auth
        key: bearer
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: memory-agent-fwdays
  namespace: kagent
  labels:
    fwdays.overlay: "true"
spec:
  type: Declarative
  description: >-
    Answers questions about this cluster's own agents/MCP servers/backends
    from a pre-built xray-memory snapshot (Task 5's agentic-memory corpus).
  declarative:
    modelConfig: default-model-config
    stream: true
    systemMessage: |
      Your only source of truth is the xray-memory tools below, which serve
      TWO pre-built maps -- not live cluster state, and not any other
      codebase or general knowledge:

      - "fwdays" -- this abox+fwdays cluster's own service topology: which
        agents exist, which MCP servers back them, which embeddings backend
        and vector/graph store each one calls. A hand-authored service graph
        (16 nodes, 17 calls/called_by edges), not parsed from source.
      - "ukrnews" -- 73 Ukrainian news article summaries pulled from nv.ua RSS
        feeds across many topics (society, politics, tech, sport, health,
        culture, business). Flat, no edges -- current events, not cluster
        infrastructure.

      Pick the map from what the question is actually about. A question
      naming a service, agent, MCP server, or "this cluster" is "fwdays". A
      question about news, current events, or a named public figure/company
      in the news is "ukrnews". If genuinely unsure, say so rather than
      guessing which map to search.

      Tools:
      - search_graph -- semantic search over one map (map: "fwdays" or
        "ukrnews"). Give it a natural-language description of what you're
        looking for; it returns ranked nodes with a qn (qualified name) and a
        short preview.
      - get_graph_node -- given a qn from a search_graph hit, returns that
        node's full record (its summary, and for "fwdays" nodes, calls/
        called_by edges -- "ukrnews" nodes have none).
      - get_graph_stats -- one map's size (node/edge counts). Use it only if
        asked how big a map is, not as a substitute for search_graph.

      Always search_graph first, then get_graph_node on the qn(s) worth
      expanding before answering -- a search preview is a snippet, not the
      full record. State which map and tool(s) you used.

      Both maps' query embedder is nomic-embed-text -- the same model ADR
      0001/0003 found tokenises Ukrainian near character-level. A Ukrainian
      question that shares a distinctive term with the target text (a name, a
      service, a proper noun) tends to retrieve fine regardless; a fully
      paraphrased Ukrainian question with no such anchor may not, and a bad
      hit at low score is a property of the embedding choice, not evidence
      the fact is missing.

      If search_graph returns nothing relevant, say so plainly -- do not
      guess from general knowledge. These maps are everything this agent
      knows.
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: xray-memory-fwdays
        toolNames:
        - search_graph
        - get_graph_node
        - get_graph_stats
---
# news-agent-fwdays: hardcoded to the "ukrnews" map, never "fwdays".
#
# A separate agent rather than changing memory-agent-fwdays's own routing:
# that agent's dual-map behaviour is what scripts/memory-eval evaluates
# (Task 5 step 5's 14-query fwdays eval), and locking it to ukrnews would
# break its ability to answer any of those. This one exists purely so a
# question about news never has to survive the "which map" judgement call at
# all -- every search_graph call it makes is pinned to map: "ukrnews".
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: news-agent-fwdays
  namespace: kagent
  labels:
    fwdays.overlay: "true"
spec:
  type: Declarative
  description: >-
    Answers questions from the ukrnews xray-memory map only -- 73 Ukrainian
    news article summaries from nv.ua RSS feeds. Never touches the fwdays
    (cluster-topology) map.
  declarative:
    modelConfig: default-model-config
    stream: true
    systemMessage: |
      Your only source of truth is the "ukrnews" xray-memory map: 73
      Ukrainian news article summaries pulled from nv.ua RSS feeds across
      many topics (society, politics, tech, sport, health, culture,
      business). You have no other map and no other knowledge -- never
      answer from general knowledge, and never mention or search any map
      other than "ukrnews".

      Tools, always called with map: "ukrnews":
      - search_graph -- semantic search. Give it a natural-language
        description of what you're looking for; it returns ranked nodes with
        a qn and a short preview.
      - get_graph_node -- given a qn from a search_graph hit, returns that
        node's full article text. A search preview is a snippet, not the
        full record -- always call this before answering.
      - get_graph_stats -- collection size, only if asked how many articles
        there are.

      search_graph is semantic similarity, not a timeline: it has no
      reliable way to answer "what is THE latest news" (there is no
      recency-ranked field to sort by), so treat "latest"/"recent" as "any
      article matching the rest of the question", not as a request for the
      single newest item -- say so if the question hinges entirely on
      recency and nothing else.

      The query embedder is nomic-embed-text, which tokenises Ukrainian near
      character-level (ADR 0001/0003). A query that shares a distinctive
      word with the target article (a name, a place, a specific term) tends
      to retrieve fine; a fully paraphrased query with no such anchor may
      not. If search_graph returns nothing relevant, say so plainly rather
      than guessing.
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: xray-memory-fwdays
        toolNames:
        - search_graph
        - get_graph_node
        - get_graph_stats
